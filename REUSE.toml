version = 1
SPDX-PackageName = "Byrsa"
SPDX-PackageSupplier = "Diego Martínez Fernández <byrsa@example.invalid>"
SPDX-PackageDownloadLocation = "https://github.com/dgmtnz/byrsa"

# Every file we write carries its own SPDX header. The blocks below cover the
# rest: formats with no comment syntax, and the platform scaffolding that
# `flutter create` generates and regenerates. `precedence = "closest"` means a
# file's own header always wins over anything declared here.

[[annotations]]
path = [
  "**/*.json", "**/*.yaml", "**/*.yml", "**/*.lock", "**/*.arb",
  "**/*.gradle", "**/*.kts", "**/*.properties", "**/*.xml", "**/*.plist",
  "**/*.podspec", "**/*.entitlements", "**/*.xcconfig",
  ".gitignore", ".gitmessage", ".fvmrc", "**/.gitignore", "**/.metadata",
  "**/gradlew", "**/gradlew.bat",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["**/*.md", "docs/**", "plan-escaner-open-source-flutter.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "CC-BY-4.0"

# Platform scaffolding generated by `flutter create`, plus the launcher icons.
# It is regenerated rather than authored, so it is annotated here rather than
# stamped with headers that the next `flutter create` would drop.

[[annotations]]
path = [
  "app/android/**", "app/ios/**", "app/macos/**", "app/linux/**",
  "app/windows/**", "app/web/**",
  "app/lib/l10n/app_localizations*.dart",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
  "packages/*/android/**", "packages/*/ios/**",
  "packages/*/example/android/**", "packages/*/example/ios/**",
  "packages/*/example/macos/**", "packages/*/example/web/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "Apache-2.0"

# The evaluation set. Photographs that may be published are CC-BY-4.0; anything
# containing personal data lives in dataset/private/, is git-ignored, and never
# reaches this file.

[[annotations]]
path = ["harness/dataset/**", "harness/example/dataset/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "CC-BY-4.0"

# The browser demo. Its sample pages are copies of the synthetic corpus, which
# is CC0 where it is generated; the Flutter scaffolding under demo/web/ is
# generated by `flutter create` and carries no headers of its own.

[[annotations]]
path = ["demo/assets/samples/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["demo/web/**", "demo/*.iml", "demo/.gitignore"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The synthetic corpus is generated, not photographed, and everything in it is
# invented — so it is CC0 rather than CC-BY, and the annotation above for
# harness/dataset/** is overridden here for that subtree.

[[annotations]]
path = ["harness/dataset/synthetic/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Diego Martínez Fernández"
SPDX-License-Identifier = "CC0-1.0"
