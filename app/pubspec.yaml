name: byrsa
description: "Byrsa — scan paper on your phone. Nothing leaves the device."
publish_to: none
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  byrsa_capture:
    path: ../packages/byrsa_capture
  byrsa_ocr:
    path: ../packages/byrsa_ocr
  byrsa_ocr_mobile_ocr:
    path: ../packages/byrsa_ocr_mobile_ocr
  byrsa_restore:
    path: ../packages/byrsa_restore
  byrsa_restore_onnx:
    path: ../packages/byrsa_restore_onnx
  dart_searchable_pdf:
    path: ../packages/dart_searchable_pdf
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  image: ^4.3.0
  image_picker: ^1.1.2
  intl: any
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.26

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # The repository's model manifest, read at run time so the settings screen
    # can show what a download costs and under what licence — from the same
    # file a reviewer reads, not a copy that drifts from it.
    #
    # A symlink, and that is the whole point. This used to read `../models.json`
    # and Flutter silently shipped nothing: assets outside the package are not
    # bundled, so on a device `rootBundle.loadString` threw, the model catalogue
    # threw with it, and every restoration aborted before it began — which took
    # OCR with it, because recognition runs after enhancement. One line in a
    # manifest, and the entire pipeline was dead on hardware while every test
    # passed. `tool/check_assets.sh` now asserts the file reaches the APK.
    - assets/models.json
