name: byrsa
description: "Byrsa — scan paper on your phone. Nothing leaves the device."
publish_to: none
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: '>=3.24.0'

dependencies:
  byrsa_capture:
    path: ../packages/byrsa_capture
  byrsa_ocr:
    path: ../packages/byrsa_ocr
  byrsa_ocr_mobile_ocr:
    path: ../packages/byrsa_ocr_mobile_ocr
  byrsa_restore:
    path: ../packages/byrsa_restore
  dart_searchable_pdf:
    path: ../packages/dart_searchable_pdf
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  image: ^4.3.0
  intl: any
  meta: ^1.15.0
  path: ^1.9.0
  path_provider: ^2.1.4
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.26

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
