name: byrsa_restore
description: >-
  On-device document restoration in pure Dart: illumination normalisation,
  shadow flattening, page filters, and grid-based dewarping.
version: 0.1.0
repository: https://github.com/dgmtnz/byrsa/tree/main/packages/byrsa_restore
issue_tracker: https://github.com/dgmtnz/byrsa/issues
topics:
  - image-processing
  - document
  - scanner
  - dewarping

resolution: workspace

environment:
  sdk: ^3.6.0

# Pure Dart, and it has to stay that way. The pipeline in here is the baseline
# every neural stage is measured against, so the evaluation harness — a plain
# command-line program — must be able to run it. ONNX Runtime arrives as a
# Flutter plugin and lives in `byrsa_restore_onnx` for exactly that reason.
# See DECISIONS.md D-040.
dependencies:
  crypto: ^3.0.5
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  image: ^4.3.0
  lints: ^6.0.0
  test: ^1.25.0
