name: byrsa_ocr
description: >-
  A stable Dart API for on-device OCR, with reading-order reconstruction and
  word boxes, independent of which engine does the recognising.
version: 0.1.0
repository: https://github.com/dgmtnz/byrsa/tree/main/packages/byrsa_ocr
issue_tracker: https://github.com/dgmtnz/byrsa/issues
topics:
  - ocr
  - text-recognition
  - document
  - scanner

resolution: workspace

environment:
  sdk: ^3.6.0

# Pure Dart, and deliberately so: no Flutter, no platform channels, no engine.
# An application picks an engine package; this one holds the API, the types and
# the logic that should not be written twice. See DECISIONS.md D-027.
dependencies:
  meta: ^1.15.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
