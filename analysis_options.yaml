include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    todo: ignore
  # Command-line programs in tool/ report to a terminal. `print` is their
  # interface, not a leftover debug statement.
  exclude:
    - "tool/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
